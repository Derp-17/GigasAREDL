<!DOCTYPE html><html lang="en"><head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1634356686777006" crossorigin="anonymous"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Challenges | Giga's Challenge List</title><link rel="stylesheet" href="css/base.css"><style>
.admin-wrap{max-width:760px;margin:45px auto;padding:0 20px;color:var(--text,#eee)}
.admin-card{padding:24px;border:1px solid var(--border,#444);border-radius:14px;background:var(--surface,#181818)}
.admin-card label{display:block;margin:12px 0 5px}.admin-card input,.admin-card select{width:100%;box-sizing:border-box;padding:11px;background:#111;color:#fff;border:1px solid #777;border-radius:7px}
.admin-card button{margin-top:20px;padding:12px 20px;border:0;border-radius:8px;background:var(--primary,#ff6e00);font-weight:bold;cursor:pointer}
.admin-card button:disabled{opacity:.5}.level-row{padding:12px 0;border-top:1px solid #555}.level-row button{margin:4px 8px 4px 0}.level-row strong{display:block}
</style></head><body><main class="admin-wrap"><p><a href="admin.html">← Staff dashboard</a></p><h1>Challenge administration</h1><p id="admin-status" role="status">Checking admin permissions…</p><section class="admin-card" id="admin-card" hidden><h2 id="form-title">Add a challenge</h2><p><a href="admin-submissions.html">Review player submissions →</a></p><form id="level-form">
<label for="name">Challenge name *</label><input id="name" maxlength="120" required>
<label for="creator">Creator</label><input id="creator" maxlength="120">
<label for="verifier">Verifier</label><input id="verifier" maxlength="120">
<label for="publisher">Publisher</label><input id="publisher" maxlength="120">
<label for="gd_level_id">Geometry Dash level ID</label><input id="gd_level_id" pattern="[0-9]*" maxlength="15" inputmode="numeric">
<label for="verifier_video_url">Verifier video URL (HTTPS)</label><input id="verifier_video_url" type="url" placeholder="https://youtu.be/...">
<label for="position">List position (optional)</label><input id="position" type="number" min="1" max="100000" step="1">
<label for="points">Points (optional — leave blank to calculate from rank)</label><input id="points" type="number" min="0" max="1000000" step="any" placeholder="Automatic from placement"><p id="points-preview" style="font-size:12px;color:#aaa;margin:7px 0 12px" aria-live="polite">Enter a position to see automatic points.</p>
<label for="list_status">List section</label><select id="list_status"><option value="active">Main</option><option value="extended">Extended</option><option value="legacy">Legacy</option><option value="unlisted">Unlisted</option></select>
<button type="submit" id="save-level">Add challenge</button> <button type="button" id="cancel-edit" hidden>Cancel edit</button></form><h2>Manage challenges</h2><p id="levels-message"></p><div id="admin-level-list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/auth-config.js"></script><script src="js/platform-config.js"></script><script src="js/admin-levels.js"></script><script src="js/gigas-ad-footer.js"></script></body></html>
