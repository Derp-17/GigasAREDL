<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Profile | Giga's Challenge List</title>
<link rel="stylesheet" href="css/base.css">
<style>
.profile-page{max-width:900px;margin:48px auto;padding:0 22px;color:var(--text,#eee)}
.profile-card{padding:28px;border-radius:16px;border:1px solid var(--border,#444);background:var(--surface,#181818)}
.profile-heading{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.profile-avatar{height:80px;width:80px;border-radius:50%;background:#393939;display:grid;place-items:center;font-size:32px;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-heading h1{margin:0 0 6px}.profile-bio{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.profile-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}
.profile-stat{padding:18px;border:1px solid #555;border-radius:12px;text-align:center}
.profile-stat strong{display:block;font-size:24px}.profile-stat span{font-size:13px;opacity:.8}
.profile-card a{color:var(--primary,#ff6e00)}
</style>
</head>
<body>
<main class="profile-page">
<p><a href="index.html">← Giga's Challenge List</a></p>
<section class="profile-card">
<div class="profile-heading"><div class="profile-avatar" id="avatar" aria-hidden="true">?</div>
<div><h1 id="player-name">Player profile</h1><p id="joined"></p></div></div>
<p id="profile-message" role="status" aria-live="polite">Loading profile…</p>
<p class="profile-bio" id="player-bio" hidden></p>
<div class="profile-stats" id="stats" hidden>
<div class="profile-stat"><strong id="approved-count">0</strong><span>Approved records</span></div>
<div class="profile-stat"><strong id="player-points">0</strong><span>List points</span></div>
<div class="profile-stat"><strong id="victor-count">0</strong><span>Victories</span></div>
</div>
<h2 id="records-title" hidden>Completed challenges</h2>
<p id="records-empty" hidden>No approved records yet.</p><div id="player-records"></div>
<a href="auth.html">Edit your profile</a>
</section>
</main>
<script src="js/platform-config.js"></script>
<script src="js/player.js"></script>
<script src="js/gigas-ad-footer.js"></script></body></html>
