name = "gigas-challenge-list-api"
main = "src/index.js"
compatibility_date = "2026-11-15"

# Create the database with:
#   npx wrangler d1 create gigas-challenge-list
# Then replace the placeholder below with the returned database_id.
[[d1_databases]]
binding = "DB"
database_name = "gigas-challenge-list"
database_id = "8e5291e2-caf3-457e-81c9-01f9cc6ca919"
migrations_dir = "migrations"

[vars]
# Set this to the deployed Pages origin before enabling browser-side API calls.
SITE_ORIGIN = "https://gigas-challenge-list.pages.dev"

# Public Supabase values; never put a secret/service_role key here.
SUPABASE_URL = "https://nnajfkanqjvtdpwiqhzh.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2esFevUmJB8QcNvVQNmc-A_74KYFq2U"

# Cloudflare cron expressions use UTC. Check Europe/London inside the Worker
# so snapshots happen at 23:00 local time in both GMT and BST.
[triggers]
crons = ["0 22,23 * * *"]
