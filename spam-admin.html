<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spam List Staff Tools | Giga's Challenge List</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/gigas-spam.css"></head><body data-spam-mode="admin"><main class="spam-wrap"><div class="spam-eyebrow">Staff dashboard / Spam list</div><h1>Manage Spam Challenge List</h1><p>Difficulty placement determines ranking. CPS is an independently recorded statistic.</p><p id="spam-status" role="status">Checking staff permissions…</p><section id="spam-editor" hidden><form id="spam-admin-form" class="spam-panel spam-form"><h2>Add or edit spam challenge</h2><label for="spam-name">Name</label><input id="spam-name" maxlength="120" required><label for="spam-creator">Creator</label><input id="spam-creator" maxlength="120"><label for="spam-verifier">Verifier</label><input id="spam-verifier" maxlength="120"><label for="spam-gdid">GD Level ID</label><input id="spam-gdid" inputmode="numeric" pattern="[0-9]*" maxlength="15"><label for="spam-video">Verification video URL</label><input id="spam-video" type="url"><div class="spam-columns"><div><label for="spam-position">Difficulty rank</label><input id="spam-position" type="number" min="1" required></div><div><label for="spam-cps">CPS</label><input id="spam-cps" type="number" min="0.01" max="100" step="0.01" required></div><div><label for="spam-duration">Duration (seconds)</label><input id="spam-duration" type="number" min="0.01" max="3600" step="0.01"></div></div><label for="spam-description">Notes</label><textarea id="spam-description" maxlength="1000"></textarea><button id="spam-save" type="submit">Add challenge</button><button id="spam-cancel" type="button" class="spam-secondary">Cancel editing</button></form><section class="spam-panel"><h2>Existing challenges</h2><div id="spam-manage-list"></div></section></section><section id="spam-review" class="spam-panel" hidden><h2>Review spam submissions</h2><div id="spam-review-list"></div></section></main><script src="js/platform-config.js"></script><script src="js/gigas-preferences.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/auth-config.js"></script><script src="js/gigas-spam.js"></script><script src="js/gigas-shared-header.js"></script><script src="js/gigas-ad-footer.js"></script><script src="js/gigas-cookie-consent.js"></script></body></html>
