<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a verification | Giga's Challenge List</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/gigas-spam.css"></head><body data-verification-mode="submit"><main class="spam-wrap"><h1>Submit a verification</h1><p id="verification-status" role="status">Loading…</p><form id="verification-form" class="spam-panel spam-form" hidden><label for="list_type">Challenge list</label><select id="list_type"><option value="main">Main Challenge List</option><option value="spam">Spam Challenge List</option></select><label for="name">Challenge name</label><input id="name" required maxlength=120><label for="creator">Creator</label><input id="creator" required maxlength=120><label for="verifier">Verifier</label><input id="verifier" required maxlength=120><label for="gd_level_id">GD level ID</label><input id="gd_level_id" required pattern="[0-9]+" maxlength=15><label for="video_url">Verification video URL</label><input id="video_url" required type=url maxlength=2048><label for="suggested_position">Suggested placement</label><input id="suggested_position" required type=number min=1 max=100000><label for="duration_seconds">Duration (seconds)</label><input id="duration_seconds" required type=number min=0.01 max=30 step=0.01><div id="cps-field" hidden><label for="cps">CPS</label><input id="cps" type=number min=0.01 max=100 step=0.01></div><label for="notes">Notes</label><textarea id="notes" maxlength="1000"></textarea><button type="submit">Submit verification</button></form><h2>My verification submissions</h2><div id="verification-list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/auth-config.js"></script><script src="js/platform-config.js"></script><script src="js/gigas-verifications.js"></script><script src="js/gigas-shared-header.js"></script></body></html>
