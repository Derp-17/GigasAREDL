<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge | Gigas Challenge List</title><link rel="stylesheet" href="css/base.css"><style>
.wrap{max-width:850px;margin:40px auto;padding:0 20px;color:var(--text,#eee)}.panel{border:1px solid #555;border-radius:14px;padding:24px;margin:18px 0;background:var(--surface,#191919)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.info p{margin:0}.info strong{display:block;margin-bottom:6px}
.victor{padding:12px 0;border-top:1px solid #555}.btn{display:inline-block;padding:12px 16px;background:var(--primary,#ff6e00);color:#111;border-radius:8px;text-decoration:none;font-weight:bold}
</style></head><body><main class="wrap"><p><a href="list.html">← Challenge rankings</a></p><h1 id="challenge-name">Loading challenge…</h1><p id="challenge-status" role="status"></p>
<section class="panel" id="challenge-content" hidden><div class="info"><p><strong>Rank</strong><span id="rank"></span></p><p><strong>Creator</strong><span id="creator"></span></p><p><strong>Verifier</strong><span id="verifier"></span></p><p><strong>Publisher</strong><span id="publisher"></span></p><p><strong>GD level ID</strong><span id="gd-id"></span></p><p><strong>Points</strong><span id="points"></span></p></div><p id="video"></p><p><a class="btn" id="submit-link" href="submit.html">Submit a record</a></p></section>
<section class="panel" id="victor-panel" hidden><h2>Verified victors</h2><div id="victors"></div></section></main>
<script src="js/platform-config.js"></script><script src="js/gigas-challenge.js"></script></body></html>
