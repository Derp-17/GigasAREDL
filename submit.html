<style>
.submit-wrap{max-width:800px;margin:40px auto;padding:0 20px;color:var(--text,#eee)}
.submit-card{padding:24px;border:1px solid var(--border,#444);border-radius:14px;background:var(--surface,#181818);margin:18px 0}
.submit-card label{display:block;margin:15px 0 6px}
.submit-card input,.submit-card select,.submit-card textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #777;border-radius:7px;background:#111;color:#fff}
.submit-card button{padding:12px 20px;background:var(--primary,#ff6e00);color:#111;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:16px}
.submit-card button:disabled{opacity:.5}.submission{padding:14px 0;border-top:1px solid #555;overflow-wrap:anywhere}
.submission strong{display:block}.submission small{opacity:.8}
</style></head><body><main class="submit-wrap">
<p><a href="index.html">← Back to Giga's Challenge List</a></p><h1>Submit a record</h1>
<p><a href="guidelines.html" style="color:#ffac75;font-weight:700">Read the submission guidelines (240 FPS, clicks, no cheats)</a> · <a href="staff.html">Staff team</a></p>\n<p id="account-status" role="status" aria-live="polite">Checking your account…</p>
<section class="submit-card"><form id="submission-form" hidden>
<label for="level">Challenge</label><select id="level" required><option value="">Choose a challenge</option></select>
<label for="percent">Completion percentage</label><input id="percent" type="number" min="1" max="100" step="1" value="100" required>
<label for="evidence">Video evidence URL</label><input id="evidence" type="url" placeholder="https://youtu.be/..." required>
<label for="notes">Notes (optional)</label><textarea id="notes" maxlength="1000" rows="3"></textarea>
<p style="font-size:13px;color:#aaa">By submitting, you confirm your record follows the <a href="guidelines.html" target="_blank" rel="noopener noreferrer" style="color:#ffac75">submission guidelines</a>.</p>\n<button id="submit-record" type="submit">Submit for review</button></form></section>
<section class="submit-card"><h2>Your submissions</h2><div id="history" aria-live="polite">Sign in to view your submissions.</div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
