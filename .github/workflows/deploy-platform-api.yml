name: Deploy Gigas Platform API

on:
  push:
    branches:
      - feature/gigas-platform-foundation
    paths:
      - 'platform-worker/**'
      - '.github/workflows/deploy-platform-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigas-platform-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
