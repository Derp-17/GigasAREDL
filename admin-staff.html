<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Staff | Giga's Challenge List</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/gigas-staff-admin.css"><style>.role-form{display:grid;gap:12px;max-width:600px}.role-form label{font-weight:700}.role-form input,.role-form select{width:100%;box-sizing:border-box;padding:12px;background:#171717;color:#fff;border:1px solid #555;border-radius:8px}.role-form button,.staff-role-row button{padding:10px 14px;background:var(--primary);color:var(--primary-on,#17110a);border:0;border-radius:8px;font-weight:700;cursor:pointer}.staff-role-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 0;border-top:1px solid var(--line)}.staff-role-row strong{min-width:140px}.staff-role-row span{flex:1;text-transform:capitalize}.staff-role-row button{background:transparent;color:var(--text-hi);border:1px solid var(--line)}.role-hint{color:var(--text-mid)}</style></head><body><main class="staff-admin-wrap"><p><a href="admin.html">← Staff dashboard</a></p><h1>Manage staff roles</h1><p class="role-hint">Owner-only. Users must create an account and player profile before you can assign a role.</p><p id="roles-status" role="status">Checking owner permissions…</p><section class="staff-admin-panel" id="roles-panel" hidden><h2>Assign or change a role</h2><form id="role-form" class="role-form"><label for="role-username">Registered username</label><input id="role-username" required maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="Exact player username"><label for="role-select">Staff role</label><select id="role-select"><option value="admin">Admin — manage challenges and submissions</option><option value="moderator">Moderator — review submissions</option><option value="helper">Helper — limited staff access</option></select><button type="submit">Save staff role</button></form><h2>Current staff</h2><div id="roles-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/auth-config.js"></script><script src="js/platform-config.js"></script><script src="js/gigas-staff-roles.js"></script><script src="js/gigas-shared-header.js"></script></body></html>
